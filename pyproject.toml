[project]
name = "jax-kernel-fusion"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["jax>=0.11.0", "numpy>=2.0"]


[project.optional-dependencies]
cuda = ["jax[cuda12]>=0.11.0"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "cpplint>=2.0.2",
    "pre-commit>=4.6.2",
]

[tool.ruff]
indent-width = 2
line-length = 80
